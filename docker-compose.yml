version: '3.8'

services:
  postgres-db:
    image: postgres:17-alpine
    container_name: hms-postgres-db
    environment:
      POSTGRES_DB: hms_db
      POSTGRES_USER: hms_user
      POSTGRES_PASSWORD: hms_password_2026
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migration/V1__init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/migration/V2__seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_user -d hms_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hms-network

  backend-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hms-backend-server
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/hms_db
      SPRING_DATASOURCE_USERNAME: hms_user
      SPRING_DATASOURCE_PASSWORD: hms_password_2026
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - hms-network

  frontend-client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCK: "false"
        VITE_API_BASE_URL: "/api"
    container_name: hms-frontend-client
    environment:
      VITE_USE_MOCK: "false"
      VITE_API_BASE_URL: "http://localhost:8080/api"
    ports:
      - "5173:80"
    depends_on:
      - backend-server
    networks:
      - hms-network

volumes:
  pgdata:
    driver: local

networks:
  hms-network:
    driver: bridge
