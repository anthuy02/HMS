name: Backend CI (Spring Boot 3 + Java 17)

on:
  push:
    paths:
      - 'backend/**'
      - 'tools/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-verify-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Clean Code & Maven Compilation
        run: mvn clean compile -B

      - name: Run Pure Domain Unit Tests & Mutation Testing (PITest)
        run: mvn test-compile org.pitest:pitest-maven:mutationCoverage -B

      - name: Run Integration Tests with Testcontainers (PostgreSQL 17)
        run: mvn verify -B

      - name: Check Business Rules (BR-01 -> BR-124) Coverage
        working-directory: .
        run: python3 tools/br_coverage.py
