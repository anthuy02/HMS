name: Backend CI (Spring Boot 3 + Java 17)

on:
  push:
    paths:
      - 'backend/**'
      - 'tools/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-verify-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Configure Maven Central Mirror & Settings
        run: |
          mkdir -p ~/.m2
          cat << 'EOF' > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <name>GCS Maven Central mirror</name>
                <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Verify Clean Code & Maven Compilation
        run: mvn clean compile -B

      - name: Run Pure Domain Unit Tests & Mutation Testing (PITest)
        run: mvn test-compile org.pitest:pitest-maven:mutationCoverage -B

      - name: Run Integration Tests with Testcontainers (PostgreSQL 17)
        run: mvn verify -B

      - name: Check Business Rules (BR-01 -> BR-124) Coverage
        working-directory: .
        run: python3 tools/br_coverage.py
